name: Build ESP32

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - cyd-2432s028
          - cyd-2432s024
          - cyd-3248s035r
          - cyd-3248s035c

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build project
        run: |
          pio run -e ${{ matrix.env }}

      - name: Prepare firmware files
        run: |
          mkdir -p firmware

          cp .pio/build/${{ matrix.env }}/firmware.bin firmware/firmware.bin
          cp .pio/build/${{ matrix.env }}/bootloader.bin firmware/bootloader.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin firmware/partitions.bin

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/
