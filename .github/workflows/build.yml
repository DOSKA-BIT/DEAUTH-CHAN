name: Build ESP32

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build project
        run: |
          pio run

      - name: Prepare firmware files
        run: |
          mkdir -p firmware

          cp .pio/build/esp32-cyd/firmware.bin firmware/firmware.bin
          cp .pio/build/esp32-cyd/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32-cyd/partitions.bin firmware/partitions.bin

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware-files
          path: firmware/
