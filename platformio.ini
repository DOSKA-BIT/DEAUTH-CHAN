; Cada placa CYD soportada tiene su propio [env:xxx] con su propio
; -D CYD_BOARD_XXXX. Las que usan TFT_eSPI con touch resistivo tienen
; ademas su propio User_Setup.h en lib/CustomTFTConfig/ porque esa
; libreria necesita el wiring como defines de compilacion.
;
; IMPORTANTE: TFT_eSPI no reconoce un -D con la ruta del archivo.
; Para que realmente use nuestro User_Setup.h hay que forzarlo con
; -include (que mete ese archivo antes que cualquier otro) y avisarle
; a la libreria con -D USER_SETUP_LOADED=1 que no cargue su propia
; configuracion por defecto.

[env:cyd-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; El firmware no usa OTA ni SPIFFS/LittleFS internos (todo el
; almacenamiento es en la SD), asi que no hace falta la particion
; de actualizacion dual de 'default.csv'. huge_app.csv da una sola
; particion de programa de 3MB en vez de 1.25MB, que es lo que
; necesitamos ahora que el firmware (con los sprites reales de la
; mascota) ya no entra en el esquema por defecto.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags =
    -D USER_SETUP_LOADED=1
    -include lib/CustomTFTConfig/User_Setup_2432S028.h
    -D CYD_BOARD_2432S028
    -D CORE_DEBUG_LEVEL=0

