; Cada placa CYD soportada va a tener su propio [env:xxx] con su
; propio -D CYD_BOARD_XXXX y su propio User_Setup si el driver de
; pantalla cambia. Por ahora solo esta la 2432S028 (fase 1), las
; demas se suman en la fase 2 sin tocar esta ya que quede andando.

[env:cyd-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -D TFT_ESPI_USER_SETUP_PATH=\"lib/CustomTFTConfig/User_Setup.h\"
    -D CYD_BOARD_2432S028
    -D CORE_DEBUG_LEVEL=0
