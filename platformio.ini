; Cada placa CYD soportada tiene su propio [env:xxx] con su propio
; -D CYD_BOARD_XXXX. Las que usan TFT_eSPI con touch resistivo tienen
; ademas su propio User_Setup.h en lib/CustomTFTConfig/ porque esa
; libreria necesita el wiring como defines de compilacion.
;
; IMPORTANTE: TFT_eSPI no reconoce un -D con la ruta del archivo.
; Para que realmente use nuestro User_Setup.h hay que forzarlo con
; -include (que mete ese archivo antes que cualquier otro) y avisarle
; a la libreria con -D USER_SETUP_LOADED=1 que no cargue su propia
; configuracion por defecto.
;
; IMPORTANTE 2: el flag -Wl,--wrap=ieee80211_raw_frame_sanity_check
; TIENE que estar en TODOS los entornos que usen Deauther. Sin el, el
; driver WiFi rechaza las tramas de deauth y el ataque no manda nada
; (enviados=0, fallidos subiendo). Antes solo estaba en cyd-2432s028.

[env:cyd-2432s028]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags =
    -D USER_SETUP_LOADED=1
    -include lib/CustomTFTConfig/User_Setup_2432S028.h
    -D CYD_BOARD_2432S028
    -D CORE_DEBUG_LEVEL=0
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

