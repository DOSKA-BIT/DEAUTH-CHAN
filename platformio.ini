; Cada placa CYD soportada tiene su propio [env:xxx] con su propio
; -D CYD_BOARD_XXXX. Las que usan TFT_eSPI con touch resistivo tienen
; ademas su propio User_Setup.h en lib/CustomTFTConfig/ porque esa
; libreria necesita el wiring como defines de compilacion.

[env:cyd-2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.33
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -D TFT_ESPI_USER_SETUP_PATH=\"lib/CustomTFTConfig/User_Setup_2432S028.h\"
    -D CYD_BOARD_2432S028
    -D CORE_DEBUG_LEVEL=0

